<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    .wrapper { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { position: absolute; top: -50px; left: -50px; width: calc(100% + 100px); height: calc(100% + 100px); border: none; }
  </style>
</head>
<body>
  <div class="wrapper">
    <iframe src="https://my.spline.design/retrofuturismbganimation-Z2GBGul3o6yS1ji4oCoYO9rL/" title="3D Background"></iframe>
  </div>
</body>
</html>
