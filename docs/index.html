<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Portfolio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; min-height: 100%; background: #0a0a0a; }
  body { overflow: hidden; }
  .canvas-wrap { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; pointer-events: none; z-index: 1; }
  .canvas-wrap canvas { display: block; width: 100%; height: 100%; filter: grayscale(1) contrast(1.1); }
  .spacer { height: 200vh; }
</style>
</head>
<body>
<div class="canvas-wrap"><canvas id="canvas"></canvas></div>

<script>
(function () {
  var canvas = document.getElementById('canvas');
  var wrap = canvas.parentElement;
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return;

  var vertSrc = [
    'attribute vec2 a_pos;',
    'void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }'
  ].join('\n');

  var fragSrc = `
precision highp float;
uniform float u_time;
uniform vec2 u_res;
uniform float u_rotationSpeed;
uniform float u_diskIntensity;
uniform float u_starsOnly;
uniform float u_tilt;
uniform float u_rotate;
uniform vec2 u_bhCenter;
uniform float u_bhScale;
uniform float u_chromatic;

const float PI = 3.14159265359;
const float TAU = 6.28318530718;
const float RS = 1.0;
const float ISCO = 3.0;
const float DISK_IN = 2.2;
const float DISK_OUT = 14.0;

float hash(vec2 p) {
    vec3 p3 = fract(vec3(p.xyx) * 0.1031);
    p3 += dot(p3, p3.yzx + 33.33);
    return fract((p3.x + p3.y) * p3.z);
}

float gNoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    return mix(
        mix(hash(i), hash(i + vec2(1, 0)), u.x),
        mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x),
        u.y
    );
}

float fbm(vec2 p) {
    float v = 0.0, a = 0.5;
    mat2 rot = mat2(0.866, 0.5, -0.5, 0.866);
    for (int i = 0; i < 4; i++) {
        v += a * gNoise(p);
        p = rot * p * 2.03 + vec2(47.0, 13.0);
        a *= 0.49;
    }
    return v;
}

vec3 starField(vec2 uv, float time) {
    vec3 col = vec3(0.0);
    vec2 suv = uv * 120.0;
    vec2 si = floor(suv); vec2 sf = fract(suv);
    float sh = hash(si);
    float br = sh * 0.6 + 0.4;
    float twinkle = 0.5 + 0.5 * sin(time * (2.0 + sh * 5.0) + sh * 100.0);
    float d = length(sf - 0.5);
    float star = smoothstep(0.08, 0.0, d) * br * (0.6 + 0.4 * twinkle);
    col += star * vec3(1.0);

    vec3 satCol = vec3(0.0);
    for (int s = 0; s < 5; s++) {
        float fi = float(s);
        vec2 sv = uv * (200.0 + fi * 60.0);
        vec2 svi = floor(sv); vec2 svf = fract(sv);
        float sh2 = hash(svi + fi * 73.0);
        float tw2 = 0.5 + 0.5 * sin(time * (1.5 + sh2 * 4.0) + sh2 * 200.0 + fi);
        float d2 = length(svf - 0.5);
        float s2 = smoothstep(0.06, 0.0, d2) * sh2 * (0.5 + 0.5 * tw2);
        vec3 tint = 0.5 + 0.5 * cos(vec3(0.0, 1.0, 2.0) + sh2 * 6.0 + fi * 1.5);
        satCol += s2 * tint * 0.25;
    }
    col += satCol;

    float md = length(uv);
    col *= smoothstep(1.2, 0.3, md);
    return col;
}

vec2 schwarzschild(vec2 p, float rS) {
    float r = length(p);
    float factor = 1.0 / (1.0 - rS / max(r, 0.01));
    return p * factor;
}

vec3 accretionDisk(float r, float phi, float time, float intensity) {
    float innerGlow = smoothstep(DISK_IN - 0.5, DISK_IN, r);
    float outerFade = smoothstep(DISK_OUT + 1.0, DISK_OUT - 1.0, r);
    float diskShape = innerGlow * outerFade;

    float temp = 8000.0 * pow(r / ISCO, -0.75);
    vec3 color;
    if (temp > 6000.0) {
        float t2 = (temp - 6000.0) / 2000.0;
        color = mix(vec3(1.0, 0.85, 0.6), vec3(1.0, 0.95, 0.85), t2);
    } else if (temp > 4000.0) {
        float t2 = (temp - 4000.0) / 2000.0;
        color = mix(vec3(0.9, 0.5, 0.2), vec3(1.0, 0.85, 0.6), t2);
    } else {
        color = vec3(0.7, 0.25, 0.05);
    }

    float spiral = sin(phi * 3.0 + r * 2.0 - time * 0.5) * 0.5 + 0.5;
    float pattern = 0.7 + 0.3 * spiral;
    float noiseR = fbm(vec2(r * 3.0, phi * 2.0) + time * 0.05);
    pattern *= 0.8 + 0.2 * noiseR;

    float doppler = 1.0 + 0.3 * sin(phi - time * 0.3) * smoothstep(DISK_IN, DISK_IN + 3.0, r);

    color *= pattern * doppler * intensity;
    color *= outerFade;
    return color;
}

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
    uv += u_bhCenter;

    vec3 col = vec3(0.0);

    float time = u_time;

    float tilt = u_tilt;
    float rot = u_rotate;
    float ca = cos(rot), sa = sin(rot);
    uv = mat2(ca, -sa, sa, ca) * uv;
    float ct = cos(tilt);
    uv.y /= max(ct, 0.01);

    float r = length(uv);
    float phi = atan(uv.y, uv.x);

    float scale = u_bhScale > 0.01 ? u_bhScale : 1.0;
    if (u_bhScale < 0.01) scale = 1.5 * (1.0 + 0.5 * sin(time * 0.1));

    vec2 bhUv = uv * scale;
    float bhR = length(bhUv);

    vec2 lensed = bhUv;
    float deflection = 1.0 / max(bhR, 0.05);
    lensed = bhUv * (1.0 + 0.25 * deflection);

    vec3 stars = starField(lensed * (0.5 + 0.5 * (1.0 - 1.0 / (1.0 + bhR * 0.3))), time);
    col += stars;

    vec3 diskCol = vec3(0.0);
    if (bhR > DISK_IN * 0.4 && bhR < DISK_OUT * 1.5) {
        float diskR = bhR;
        float diskPhi = phi + time * 0.05 * u_rotationSpeed;
        float ringPattern = 0.0;
        for (int ri = 0; ri < 4; ri++) {
            float rf = float(ri);
            float ringR = DISK_IN + 2.0 + rf * 2.5;
            float ringWidth = 1.2;
            float ring = exp(-0.5 * pow((diskR - ringR) / ringWidth, 2.0));
            ringPattern += ring * (0.3 + 0.7 * (0.5 + 0.5 * sin(diskPhi * 2.0 + rf * 3.0)));
        }
        diskCol = accretionDisk(diskR, diskPhi, time, u_diskIntensity);
        diskCol *= 1.0 + 0.3 * ringPattern;
    }

    float shadow = 1.0 - smoothstep(0.8, 3.0, bhR);
    diskCol *= 1.0 - shadow * 0.7;

    col = mix(col, diskCol, 0.7 * (1.0 - starsOnly));

    if (bhR < RS * 1.02) {
        col = vec3(0.0);
    }

    float ev = 1.0 / max(bhR, RS);
    float blueShift = 1.0 + 0.15 * ev;
    col *= blueShift;

    float phiLens = atan(lensed.y, lensed.x);
    float lensFlare = 0.0;
    for (int fl = 0; fl < 3; fl++) {
        float flf = float(fl);
        float flAng = phiLens + flf * 2.2 + time * (0.1 + flf * 0.05);
        vec2 flDir = vec2(cos(flAng), sin(flAng));
        float flProj = dot(normalize(lensed), flDir);
        float fl = max(0.0, flProj) * exp(-bhR * 0.5);
        lensFlare += fl * (0.08 - flf * 0.02);
    }
    col += vec3(1.0, 0.85, 0.6) * lensFlare * (1.0 - starsOnly);

    float vignette = 1.0 - 0.35 * length(uv);
    col *= vignette;

    col = clamp(col, 0.0, 1.0);
    col = pow(col, vec3(1.0 / 2.2));

    float chroma = u_chromatic;
    if (chroma > 0.01) {
        float cx = 0.005 * chroma;
        vec2 cuv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
        float cr = length(cuv);
        float cShift = 0.001 * chroma * cr;
        col.r = texture2D(gl_FragCoord.xy / u_res + vec2(cShift, 0.0)).r;
        col.b = texture2D(gl_FragCoord.xy / u_res - vec2(cShift, 0.0)).b;
    }

    gl_FragColor = vec4(col, 1.0);
}
`;

  function compileShader(src, type) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s));
      gl.deleteShader(s);
      return null;
    }
    return s;
  }

  var vs = compileShader(vertSrc, gl.VERTEX_SHADER);
  var fs = compileShader(fragSrc, gl.FRAGMENT_SHADER);
  if (!vs || !fs) return;
  var prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var uTime = gl.getUniformLocation(prog, 'u_time');
  var uRes = gl.getUniformLocation(prog, 'u_res');
  var uRotationSpeed = gl.getUniformLocation(prog, 'u_rotationSpeed');
  var uDiskIntensity = gl.getUniformLocation(prog, 'u_diskIntensity');
  var uStarsOnly = gl.getUniformLocation(prog, 'u_starsOnly');
  var uTilt = gl.getUniformLocation(prog, 'u_tilt');
  var uRotate = gl.getUniformLocation(prog, 'u_rotate');
  var uBhCenter = gl.getUniformLocation(prog, 'u_bhCenter');
  var uBhScale = gl.getUniformLocation(prog, 'u_bhScale');
  var uChromatic = gl.getUniformLocation(prog, 'u_chromatic');

  var rotationSpeedVal = 0.3;
  var diskIntensityVal = 1.0;
  var starsOnlyVal = 0.0;
  var tiltVal = 0.0;
  var rotateVal = 0.0;
  var bhCenterX = 0.0;
  var bhCenterY = 0.0;
  var bhScaleVal = 0.0;
  var chromaticVal = 0.0;

  // Mouse follow — black hole moves toward cursor
  var mouseX = 0.0, mouseY = 0.0;
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) / rect.width * 2.0 - 1.0;
    mouseY = (e.clientY - rect.top) / rect.height * 2.0 - 1.0;
  });

  var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  var needsResize = true;
  var running = true;

  function resize() {
    needsResize = false;
    var w = Math.round(canvas.clientWidth * dpr);
    var h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
      gl.uniform2f(uRes, canvas.width, canvas.height);
    }
  }

  function render(now) {
    if (!running) return;
    if (needsResize) resize();
    var t = prefersReduced ? 0.0 : now * 0.001;

    // Smooth mouse follow for black hole position
    bhCenterX += (mouseX * 0.5 - bhCenterX) * 0.05;
    bhCenterY += (-mouseY * 0.5 - bhCenterY) * 0.05;

    gl.uniform1f(uTime, t);
    gl.uniform1f(uRotationSpeed, rotationSpeedVal);
    gl.uniform1f(uDiskIntensity, diskIntensityVal);
    gl.uniform1f(uStarsOnly, starsOnlyVal);
    gl.uniform1f(uTilt, tiltVal);
    gl.uniform1f(uRotate, rotateVal);
    gl.uniform2f(uBhCenter, bhCenterX, bhCenterY);
    gl.uniform1f(uBhScale, bhScaleVal);
    gl.uniform1f(uChromatic, chromaticVal);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(render);
  }

  window.addEventListener('resize', function () { needsResize = true; });

  resize();
  requestAnimationFrame(render);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { running = false; }
    else { running = true; requestAnimationFrame(render); }
  });

  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'param') {
      switch (e.data.name) {
        case 'ROTATION_SPEED': rotationSpeedVal = e.data.value; break;
        case 'DISK_INTENSITY': diskIntensityVal = e.data.value; break;
        case 'STARS_ONLY': starsOnlyVal = e.data.value; break;
        case 'TILT': tiltVal = e.data.value; break;
        case 'ROTATE': rotateVal = e.data.value; break;
        case 'BH_CENTER_X': bhCenterX = e.data.value; break;
        case 'BH_CENTER_Y': bhCenterY = e.data.value; break;
        case 'BH_SCALE': bhScaleVal = e.data.value; break;
        case 'CHROMATIC': chromaticVal = e.data.value; break;
      }
    }
  });


})();
</script>
</body>
</html>
